<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Main</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #050609 url("assets/background1.png") center center / cover no-repeat fixed;
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(circle, rgba(255, 250, 224, 0.95) 0 7%, rgba(230, 242, 255, 0.58) 22%, rgba(180, 220, 255, 0.18) 52%, rgba(180, 220, 255, 0) 100%);
      box-shadow: 0 0 calc(var(--size) * 1.6) rgba(230, 242, 255, 0.9);
      transform: translate3d(0, 0, 0);
      animation: particle-float var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
      will-change: transform, opacity;
    }

    .particle:nth-child(1) { --x: 8%; --y: 78%; --size: 9px; --duration: 13s; --delay: -2s; }
    .particle:nth-child(2) { --x: 17%; --y: 34%; --size: 5px; --duration: 18s; --delay: -7s; }
    .particle:nth-child(3) { --x: 24%; --y: 68%; --size: 12px; --duration: 15s; --delay: -4s; }
    .particle:nth-child(4) { --x: 31%; --y: 17%; --size: 7px; --duration: 20s; --delay: -10s; }
    .particle:nth-child(5) { --x: 39%; --y: 82%; --size: 6px; --duration: 16s; --delay: -1s; }
    .particle:nth-child(6) { --x: 45%; --y: 42%; --size: 14px; --duration: 19s; --delay: -8s; }
    .particle:nth-child(7) { --x: 53%; --y: 23%; --size: 8px; --duration: 14s; --delay: -5s; }
    .particle:nth-child(8) { --x: 59%; --y: 72%; --size: 10px; --duration: 21s; --delay: -12s; }
    .particle:nth-child(9) { --x: 66%; --y: 49%; --size: 6px; --duration: 17s; --delay: -3s; }
    .particle:nth-child(10) { --x: 72%; --y: 86%; --size: 13px; --duration: 18s; --delay: -9s; }
    .particle:nth-child(11) { --x: 79%; --y: 29%; --size: 7px; --duration: 22s; --delay: -6s; }
    .particle:nth-child(12) { --x: 88%; --y: 62%; --size: 11px; --duration: 15s; --delay: -11s; }
    .particle:nth-child(13) { --x: 93%; --y: 38%; --size: 5px; --duration: 19s; --delay: -13s; }
    .particle:nth-child(14) { --x: 12%; --y: 51%; --size: 15px; --duration: 23s; --delay: -14s; }
    .particle:nth-child(15) { --x: 34%; --y: 57%; --size: 8px; --duration: 16s; --delay: -6s; }
    .particle:nth-child(16) { --x: 84%; --y: 76%; --size: 6px; --duration: 20s; --delay: -2s; }

    @keyframes particle-float {
      0% {
        opacity: 0;
        transform: translate3d(0, 18px, 0) scale(0.76);
      }

      18%,
      82% {
        opacity: 0.92;
      }

      50% {
        transform: translate3d(28px, -42px, 0) scale(1.12);
      }

      100% {
        opacity: 0;
        transform: translate3d(-18px, -96px, 0) scale(0.82);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .particle {
        animation: none;
        opacity: 0.72;
      }
    }
  </style>
</head>
<body>
  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>
</body>
</html>
